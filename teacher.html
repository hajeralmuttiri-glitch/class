<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة المعلمة | مسابقة أنواع المخططات الستة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- بوابة كلمة المرور -->
  <div class="gate" id="gate">
    <div class="gate-box">
      <h2>🔒 لوحة المعلمة</h2>
      <p class="answer-text">هذه اللوحة خاصة بالمعلمة فقط</p>
      <input type="text" id="pwInput" placeholder="كلمة المرور" />
      <div class="gate-error" id="pwError"></div>
      <button class="btn-primary" id="pwBtn" style="width:100%;">دخول</button>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="wrap" id="dashboard" style="display:none;">
    <div class="topbar">
      <div class="brand">
        <div class="logo">📊</div>
        <div>
          <h1>مسابقة أنواع المخططات الستة</h1>
          <span>لوحة تحكم المعلمة</span>
        </div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <div class="stage-pill" id="stagePill">—</div>
        <button class="btn-primary" id="nextStageBtn">فتح المرحلة التالية ⬅</button>
      </div>
    </div>

    <div class="progress" id="progressSteps"></div>

    <!-- بطاقات الفرق -->
    <div class="grid" id="teamsGrid"></div>

    <!-- التصويت -->
    <div class="card" style="margin-top:24px;">
      <h3>نتائج التصويت</h3>
      <div id="voteResults"></div>
    </div>

    <!-- الفائز -->
    <div style="margin-top:24px;">
      <button class="btn-secondary" id="announceWinnerBtn">🏆 احتساب وإعلان الفائز</button>
      <div id="winnerBox" style="margin-top:16px;"></div>
    </div>

    <div style="margin-top:30px; text-align:center;">
      <button class="btn-danger" id="resetBtn">إعادة تصفير المسابقة بالكامل</button>
    </div>
  </div>

  <script type="module" src="teacher.js"></script>
</body>
</html>
